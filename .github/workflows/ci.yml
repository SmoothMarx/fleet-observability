name: CI

# The plugin is loaded uncompiled by the desktop app, so there is nothing to
# build — the job is: does the thing load, does it behave, has the SDK moved?
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Syntax-check the plugin
        run: node --check plugin.js

      - name: Smoke suite
        run: npm test

      - name: SDK drift check
        run: npm run check:sdk
